# Checks that gate a pull request and run again on main. The Release workflow reuses this file
# (workflow_call) so nothing ships on a red tree.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"

jobs:
  lint:
    name: lint, format, types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.10"
          enable-cache: true
      - run: uv sync --frozen
      - name: ruff lint
        run: uv run --frozen ruff check .
      - name: ruff format
        run: uv run --frozen ruff format --check .
      - name: mypy
        run: uv run --frozen mypy src

  test:
    name: python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --frozen
      - name: pytest
        run: uv run --frozen pytest -q

  package:
    name: package checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - name: build wheel and sdist
        run: uv build --out-dir dist
      - name: check metadata
        run: uvx twine check --strict dist/*
