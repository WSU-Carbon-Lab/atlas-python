[project]
name = "xrayatlas"
version = "0.1.0"
description = "Python client for X-ray Atlas NEXAFS data and optical models"
readme = "README.md"
authors = [
    { name = "Harlan D Heilman", email = "73567020+HarlanHeilman@users.noreply.github.com" }
]
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = [
    "nexafs",
    "xanes",
    "x-ray absorption",
    "spectroscopy",
    "optical constants",
    "synchrotron",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.28.1",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "pydantic>=2",
]

[project.urls]
Homepage = "https://xrayatlas.wsu.edu"
Documentation = "https://xrayatlas.wsu.edu/docs/python"
Source = "https://github.com/WSU-Carbon-Lab/atlas-python"
Issues = "https://github.com/WSU-Carbon-Lab/atlas-python/issues"
Releases = "https://github.com/WSU-Carbon-Lab/atlas-python/releases"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pandas-stubs>=2.3.3.260113",
    "pytest>=9.1.1",
    "respx>=0.23.1",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["xrayatlas", "_shared"]

[tool.mypy]
strict = true
python_version = "3.10"

[tool.hatch.build.targets.sdist]
exclude = [".github", ".python-version", "uv.lock"]
